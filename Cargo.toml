[package]
name = "zcash_client_memory"
version = "0.0.0"
# readme = "README.md"
repository = "https://github.com/zcash/zcash_client_memory"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.81"
build = "build.rs"

# Exclude proto files so crates.io consumers don't need protoc.
exclude = ["*.proto"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
zcash_client_backend = {version = "0.19", features = ["unstable-serialization", "unstable-spanning-tree", "sync"]}
zcash_address = {version = "0.9", default-features = false}
zcash_keys = {version = "0.10", features = ["sapling"]}
zcash_encoding = {version = "0.3", default-features = false}
zcash_primitives = {version = "0.24", default-features = false}
zcash_protocol = {version = "0.6.1", default-features = false}
transparent = {package = "zcash_transparent", version = "0.4", default-features = false}

tokio = {version = "1", features = ["sync"]}

# Dependencies exposed in a public API:
# (Breaking upgrades to these require a breaking upgrade to this crate.)
# - Errors
bip32 = {version = "=0.6.0-pre.1", default-features = false, optional = true}
zip32 = {version = "0.2", default-features = false}

# - Logging and metrics
bs58 = {version = "0.5", default-features = false, features = ["alloc", "check"]}

# - Serialization
tracing = {version = "0.1", default-features = false}
byteorder = "1"
nonempty = {version = "0.11", default-features = false}
prost = "0.13"
group = "0.13"
jubjub = "0.10"

# - Secret management
serde = {version = "1", default-features = false, features = ["derive"]}
secrecy = "0.8"

# - Static assertions
subtle = {version = "2.2.3", default-features = false}

# - Shielded protocols
orchard = {version = "0.11", default-features = false, optional = true}
static_assertions = "1"

# - Note commitment trees
sapling = {package = "sapling-crypto", version = "0.5", default-features = false}
shardtree = {version = "0.6.1", features = ["legacy-api"]}
thiserror = "1.0.61"

incrementalmerkletree = {version = "0.8.2", default-features = false}
async-trait = { version = "0.1" }

# - Test dependencies
proptest = {version = ">=1,<1.7", optional = true}
wasm_sync = "0.1.2"
rayon = "1.5"
bytes = "1.9.0"
time = {version = "0.3.22", default-features = false}

[dev-dependencies]
ciborium = "0.2.2"
postcard = { version = "1.0.10", features = ["alloc"] }
zcash_client_backend = {version = "0.19", features = ["test-dependencies"]}
serde_json = "1"


[features]
default = ["multicore"]
local-consensus = ["zcash_protocol/local-consensus"]
## Enables multithreading support for creating proofs and building subtrees.
multicore = ["zcash_primitives/multicore"]

## Enables support for storing data related to the sending and receiving of 
## Orchard funds.
orchard = ["dep:orchard", "zcash_client_backend/orchard", "zcash_keys/orchard"]

## Exposes APIs that are useful for testing, such as `proptest` strategies.
test-dependencies = ["dep:proptest", "incrementalmerkletree/test-dependencies", "shardtree/test-dependencies", "zcash_primitives/test-dependencies", "zcash_client_backend/test-dependencies", "incrementalmerkletree/test-dependencies"]

## Enables receiving transparent funds and sending to transparent recipients
transparent-inputs = ["dep:bip32", "zcash_keys/transparent-inputs", "zcash_client_backend/transparent-inputs"]

#! ### Experimental features

## Exposes unstable APIs. Their behaviour may change at any time.
unstable = ["zcash_client_backend/unstable"]

## Enables compatibility with legacy zcashd wallet data
zcashd-compat = ["zcash_keys/zcashd-compat", "zcash_client_backend/zcashd-compat"]

[build-dependencies]
prost-build = "0.13.3"
which = "7"

[workspace]

[patch.crates-io]
equihash = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zcash_address = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zcash_client_backend = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zcash_encoding = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zcash_keys = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zcash_protocol = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zip321 = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zcash_primitives = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zcash_proofs = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
pczt = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}
zcash_transparent = {git = "https://github.com/zcash/librustzcash", rev = "17b1e12ba510754d96faa3b8bab014d9dd78f36f"}

[profile.release]
lto = true
panic = 'abort'
codegen-units = 1

[profile.test]
# Since we have many computationally expensive tests, this changes the test profile to
# compile with optimizations by default, but keep full debug info.
#
# This differs from the release profile in the following ways:
# - it does not set `lto = true`, which increases compile times without substantially
#   speeding up tests;
# - it does not set `codegen-units = 1`, which increases compile times and is only
#   useful to improve determinism of release builds;
# - it does not set `panic = 'abort'`, which is in any case ignored for tests.
#
# To get results as close as possible to a release build, use `cargo test --release`.
# To speed up compilation and avoid optimizations potentially resulting in lower-quality
# debug info, use `cargo test --profile=dev`.
opt-level = 3
debug = true

