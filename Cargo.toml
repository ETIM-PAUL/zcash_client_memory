[package]
name = "zcash_client_memory"
version = "0.0.0"
# readme = "README.md"
repository = "https://github.com/zcash/zcash_client_memory"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85.1"
build = "build.rs"

# Exclude proto files so crates.io consumers don't need protoc.
exclude = ["*.proto"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
zcash_client_backend = {version = "0.23", features = ["unstable-serialization", "unstable-spanning-tree", "sync"]}
zcash_address = {version = "0.12", default-features = false}
zcash_keys = {version = "0.14", default-features = false, features = ["sapling"]}
zcash_encoding = {version = "0.4", default-features = false}
zcash_primitives = {version = "0.28", default-features = false}
zcash_protocol = {version = "0.9", default-features = false}
transparent = {package = "zcash_transparent", version = "0.8.0", default-features = false}

tokio = {version = "1", features = ["sync"]}

# Dependencies exposed in a public API:
# (Breaking upgrades to these require a breaking upgrade to this crate.)
# - Errors
bip32 = {version = "=0.6.0-pre.1", default-features = false, features = ["alloc"], optional = true}
zip32 = {version = "0.2", default-features = false}

# - Logging and metrics
bs58 = {version = "0.5", default-features = false, features = ["alloc", "check"]}

# - Serialization
tracing = {version = "0.1", default-features = false}
byteorder = "1"
nonempty = {version = "0.11", default-features = false}
prost = "0.14"
group = "0.13"
jubjub = "0.10"

# - Secret management
serde = {version = "1", default-features = false, features = ["derive"]}
secrecy = "0.8"

# - Static assertions
subtle = {version = "2.2.3", default-features = false}

# - Shielded protocols
orchard = {version = "0.14", default-features = false, optional = true}
static_assertions = "1"

# - Transparent protocol
secp256k1 = {version = "0.29", default-features = false, features = ["alloc"], optional = true}
sapling = {package = "sapling-crypto", version = "0.7", default-features = false}

# - Note commitment trees
zcash_script = {version = "0.4.3", default-features = false}
shardtree = {version = "0.6.2", features = ["legacy-api"]}

thiserror = "2.0.12"
incrementalmerkletree = {version = "0.8.2", default-features = false}
async-trait = { version = "0.1" }

# - Test dependencies
proptest = {version = ">=1,<1.7", optional = true}
wasm_sync = "0.1.2"
rayon = "1.5"
bytes = "1.9.0"
time = {version = "0.3.22", default-features = false}

[dev-dependencies]
ciborium = "0.2.2"
serde_json = "1"
zcash_client_backend = {version = "0.23", features = ["test-dependencies"]}
postcard = {version = "1", default-features = false, features = ["alloc"]}


[features]
default = ["multicore"]
local-consensus = ["zcash_protocol/local-consensus"]
## Enables multithreading support for creating proofs and building subtrees.
multicore = ["zcash_primitives/multicore"]

## Enables support for storing data related to the sending and receiving of
## Orchard funds.
orchard = ["dep:orchard", "zcash_client_backend/orchard", "zcash_keys/orchard"]

## Exposes APIs that are useful for testing, such as `proptest` strategies.
test-dependencies = [
  "dep:proptest",
  "incrementalmerkletree/test-dependencies",
  "shardtree/test-dependencies",
  "zcash_primitives/test-dependencies",
  "zcash_client_backend/test-dependencies",
  "incrementalmerkletree/test-dependencies"
]

## Enables receiving transparent funds and sending to transparent recipients
transparent-inputs = [
  "dep:bip32",
  "dep:secp256k1",
  "zcash_keys/transparent-inputs",
  "zcash_client_backend/transparent-inputs"
]

# Enables operations that permit arbitrary transparent pubkeys to be associated
# with an account in the wallet. Applications that rely on this feature must
# maintain spending keys corresponding to all imported pubkeys for any account
# from which it permits spending.
transparent-key-import = [
  "transparent-inputs",
  "zcash_client_backend/transparent-key-import"
]

#! ### Experimental features

## Exposes unstable APIs. Their behaviour may change at any time.
unstable = ["zcash_client_backend/unstable"]

## Enables compatibility with legacy zcashd wallet data
zcashd-compat = ["zcash_keys/zcashd-compat", "zcash_client_backend/zcashd-compat"]

## Enables the prospective ZIP 233 (Network Sustainability Mechanism) feature.
zip-233 = ["zcash_primitives/zip-233"]

[build-dependencies]
prost-build = "0.14"
which = "8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(tokio_unstable)',
  'cfg(zcash_unstable, values("zfuture", "nu7"))',
  'cfg(live_network_tests)',
] }

[workspace]

[patch.crates-io]
equihash = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zcash_address = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zcash_client_backend = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zcash_encoding = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zcash_keys = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zcash_protocol = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zip321 = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zcash_primitives = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zcash_proofs = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
pczt = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}
zcash_transparent = {git = "https://github.com/zcash/librustzcash", rev = "97416db85512d7aa81d7f48a93f78d097bffd6b8"}

[profile.release]
lto = true
panic = 'abort'
codegen-units = 1

[profile.test]
# Since we have many computationally expensive tests, this changes the test profile to
# compile with optimizations by default, but keep full debug info.
#
# This differs from the release profile in the following ways:
# - it does not set `lto = true`, which increases compile times without substantially
#   speeding up tests;
# - it does not set `codegen-units = 1`, which increases compile times and is only
#   useful to improve determinism of release builds;
# - it does not set `panic = 'abort'`, which is in any case ignored for tests.
#
# To get results as close as possible to a release build, use `cargo test --release`.
# To speed up compilation and avoid optimizations potentially resulting in lower-quality
# debug info, use `cargo test --profile=dev`.
opt-level = 3
debug = true

